<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P チャット (PeerJS)</title>
    <!-- UIを綺麗にするためのTailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- WebRTCの複雑な処理を簡単にしてくれるPeerJSライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col h-[600px]">
        
        <div class="bg-indigo-600 p-4 text-white">
            <h1 class="text-xl font-bold flex items-center gap-2">P2P Chat</h1>
            <p id="status-text" class="text-indigo-200 text-sm mt-1">シグナリングサーバーに接続中...</p>
        </div>

        <div class="p-4 border-b border-slate-100 bg-slate-50">
            <div class="mb-3">
                <label class="block text-xs font-semibold text-slate-500 mb-1">あなたのID（相手に教える用）</label>
                <div class="flex">
                    <input type="text" id="my-id-display" readonly class="w-full bg-slate-200 text-slate-700 text-sm rounded-l-lg px-3 py-2 outline-none" value="取得中...">
                    <button id="copy-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white text-sm px-3 py-2 rounded-r-lg">コピー</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">相手のIDを入力して接続</label>
                <div class="flex gap-2">
                    <input type="text" id="target-id-input" placeholder="相手のIDを貼り付け" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    <button id="connect-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm whitespace-nowrap">接続</button>
                </div>
            </div>
        </div>

        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto bg-white flex flex-col gap-3">
            <div class="text-center text-xs text-slate-400 my-2">
                ここにメッセージが表示されます。<br>プレビューを2つ開いて（または別タブで）接続をテストできます。
            </div>
        </div>

        <div class="p-4 border-t border-slate-100 bg-slate-50">
            <div class="flex gap-2">
                <input type="text" id="message-input" placeholder="メッセージを入力..." disabled class="w-full border border-slate-300 rounded-full px-4 py-2 text-sm outline-none disabled:bg-slate-100">
                <button id="send-btn" disabled class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-2 w-10 h-10 flex items-center justify-center disabled:bg-slate-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-0.5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;

        const myIdDisplay = document.getElementById('my-id-display');
        const statusText = document.getElementById('status-text');
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // =====================================================================
        // 1. シグナリングサーバーへの接続（お互いを見つけるための準備）
        // =====================================================================
        function initializePeer() {
            // new Peer() を実行した瞬間、PeerJSが提供する中央サーバー（シグナリングサーバー）に接続します。
            // P2P通信といえど、最初はお互いのIPアドレス等を知るための「お見合い会場（サーバー）」が必要です。
            peer = new Peer({ debug: 2 });

            // サーバーから自分専用のIDが割り当てられたときの処理
            peer.on('open', (id) => {
                myIdDisplay.value = id;
                updateStatus("待機中 (接続待ち)");
                showSystemMessage("シグナリングサーバーからIDを取得しました。相手にこのIDを伝えてください。");
            });

            // 相手から接続要求（オファー）が来たときの処理
            peer.on('connection', (incomingConnection) => {
                showSystemMessage(`相手(${incomingConnection.peer.substring(0,5)}...)から接続要求を受け取りました。`);
                setupConnection(incomingConnection);
            });
        }

        // =====================================================================
        // 2. 相手への接続要求（オファーの送信）
        // =====================================================================
        document.getElementById('connect-btn').addEventListener('click', () => {
            const targetId = document.getElementById('target-id-input').value.trim();
            if (!targetId) return;
            
            updateStatus("相手を探しています...", "text-yellow-300");
            showSystemMessage("シグナリングサーバー経由で相手の経路情報を探しています(ICE/SDP交換)...");

            // peer.connect() は、シグナリングサーバーに対して「このIDの人と繋ぎたい！」と要求を送ります。
            // サーバーが両者のIPアドレス情報（ICE Candidates）などを交換し、直接通信の穴あけを試みます。
            const newConnection = peer.connect(targetId);
            setupConnection(newConnection);
        });

        // =====================================================================
        // 3. P2P接続の確立とデータ送受信
        // =====================================================================
        function setupConnection(connection) {
            conn = connection;

            // 経路の穴あけ（NAT越え）が完了し、ブラウザ同士が直接繋がった瞬間に 'open' が発火します。
            // これ以降のデータ通信は、サーバーを通らずに直接（P2Pで）行われます！
            conn.on('open', () => {
                updateStatus("P2P接続 完了", "text-emerald-300");
                showSystemMessage("🎉 WebRTCによるP2P接続が確立しました！サーバーを通さず直接通信しています。", "success");
                
                messageInput.disabled = false;
                sendBtn.disabled = false;
            });

            // 相手からP2Pで直接データを受け取った時
            conn.on('data', (data) => {
                appendMessage(data, 'received');
            });

            conn.on('close', () => {
                updateStatus("切断されました", "text-red-300");
                showSystemMessage("相手とのP2P接続が切断されました。");
                messageInput.disabled = true;
                sendBtn.disabled = true;
            });
        }

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (msg === '' || !conn || !conn.open) return;

            // P2P通信で相手に直接データを送る（超高速で、サーバー代もかからない！）
            conn.send(msg);
            
            appendMessage(msg, 'sent');
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        document.getElementById('copy-btn').addEventListener('click', (e) => {
            myIdDisplay.select();
            document.execCommand('copy');
            e.target.textContent = 'OK!';
            setTimeout(() => e.target.textContent = 'コピー', 1500);
        });

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('max-w-[80%]', 'p-3', 'rounded-2xl', 'text-sm', 'w-fit', 'animate-fade-in');
            if (type === 'sent') {
                msgDiv.classList.add('bg-indigo-600', 'text-white', 'ml-auto', 'rounded-tr-sm');
            } else {
                msgDiv.classList.add('bg-slate-100', 'text-slate-800', 'mr-auto', 'rounded-tl-sm');
            }
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showSystemMessage(text, type = 'info') {
            const sysDiv = document.createElement('div');
            sysDiv.classList.add('text-center', 'text-xs', 'my-2', 'font-medium', 'px-4');
            sysDiv.classList.add(type === 'success' ? 'text-emerald-500' : 'text-slate-400');
            sysDiv.textContent = text;
            chatMessages.appendChild(sysDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function updateStatus(text, colorClass = "text-indigo-200") {
            statusText.textContent = text;
            statusText.className = `text-sm mt-1 transition-colors ${colorClass}`;
        }

        // 起動
        initializePeer();
    </script>
    
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</body>
</html>
